name: Android Release to S3

on:
  push:
    tags:
      - 'v*' # Sẽ chạy tự động nếu tag có dạng v1.0.0

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: Grant execution permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android-app/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Generate version.json
        id: gen_version
        run: |
          # Bắt Tag name (v1.2.3 -> 1.2.3)
          VERSION_NAME=${GITHUB_REF#refs/tags/v}
          
          # Lấy versionCode từ build.gradle
          VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          
          # Lấy thông tin app
          APK_PATH="${{steps.sign_app.outputs.signedReleaseFile}}"
          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(stat -c%s "$APK_PATH")
          RELEASE_NOTES="Cập nhật hệ thống lên phiên bản $VERSION_NAME"

          echo "Đang tạo version.json..."
          cat <<EOF > version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkName": "$APK_NAME",
            "downloadUrl": "https://comicverse-storage.s3.ap-southeast-1.amazonaws.com/android-updates/$APK_NAME",
            "releaseNotes": "$RELEASE_NOTES",
            "isForceUpdate": false,
            "apkSize": $APK_SIZE
          }
          EOF
          
          cat version.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to AWS S3
        run: |
          APK_PATH="${{steps.sign_app.outputs.signedReleaseFile}}"
          APK_NAME=$(basename "$APK_PATH")
          
          echo "Đẩy file APK lên S3..."
          aws s3 cp "$APK_PATH" s3://comicverse-storage/android-updates/ \
            --content-type "application/vnd.android.package-archive" \
            --acl public-read
            
          echo "Đẩy file version.json lên S3..."
          aws s3 cp version.json s3://comicverse-storage/android-updates/ \
            --content-type "application/json" \
            --acl public-read
            
          echo "✨ Upload thành công!"
